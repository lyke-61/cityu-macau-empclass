name: 抓取教室占用

# 注：学校服务器不接受 GitHub 机房的连接（TCP 超时），
# 所以定时抓取改在本地机器上跑，见 scripts/local_run.sh。
# 这里只保留手动触发，用来测试。
on:
  workflow_dispatch:

permissions:
  contents: write             # 需要写权限才能把结果提交回去

concurrency:
  group: scrape-rooms
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 失败也继续往下走，这样错误日志能被提交回仓库（data/last_error.txt）
      - name: 抓取六个楼栋
        id: scrape
        continue-on-error: true
        run: python3 scraper/fetch_rooms.py --out data/rooms.json

      - name: 提交结果
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新教室占用 $(date -u +'%Y-%m-%d %H:%MZ')"
          git push

      # 抓取失败时让整个运行标红，但不影响日志已经提交
      - name: 标记失败
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "抓取失败，详情见 data/last_error.txt"
          exit 1
